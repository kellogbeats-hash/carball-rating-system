<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CarBall Rankings</title>
    <style>
        body { font-family: Arial; max-width: 1200px; margin: 20px auto; padding: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #2c3e50; color: white; }
        .search-box { margin: 20px 0; }
        .search-box input { padding: 10px; width: 300px; }
    </style>
</head>
<body>

<h1>🚗 CarBall Player Rankings</h1>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search player...">
</div>

<table id="playerTable">
    <thead>
        <tr>
            <th>#</th>
            <th>Nick</th>
            <th>Rating</th>
            <th>Role</th>
            <th>Tier</th>
            <th>Matches</th>
            <th>Win %</th>
            <th>Goals</th>
            <th>Assists</th>
            <th>Saves</th>
        </tr>
    </thead>
    <tbody id="tableBody">
        <tr><td colspan="10">Loading...</td></tr>
    </tbody>
</table>

<script>
// Verileri yükle
fetch('data/players.csv')
    .then(response => response.text())
    .then(csvText => {
        const lines = csvText.split('\n').filter(line => line.trim());
        const headers = lines[0].split(',').map(h => h.trim());
        
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        for (let i = 1; i < lines.length; i++) {
            const values = lines[i].split(',');
            const row = {};
            headers.forEach((h, idx) => {
                row[h] = values[idx] ? values[idx].trim() : '';
            });
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${i}</td>
                <td><strong>${row.Nick}</strong></td>
                <td>${row.Rating}</td>
                <td>${row.Role}</td>
                <td>${row.Tier}</td>
                <td>${row.Matches}</td>
                <td>${row.Win_Rate}</td>
                <td>${row.Goals}</td>
                <td>${row.Assists}</td>
                <td>${row.Saves}</td>
            `;
            tbody.appendChild(tr);
        }
    })
    .catch(error => {
        document.getElementById('tableBody').innerHTML = 
            `<tr><td colspan="10" style="color:red;">❌ Error: ${error.message}</td></tr>`;
    });

// Arama özelliği
document.getElementById('searchInput').addEventListener('keyup', function() {
    const filter = this.value.toLowerCase();
    const rows = document.querySelectorAll('#tableBody tr');
    rows.forEach(row => {
        const nick = row.cells[1]?.textContent?.toLowerCase() || '';
        row.style.display = nick.includes(filter) ? '' : 'none';
    });
});
</script>

</body>
</html>
